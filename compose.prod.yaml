# Production compose file. NO `build:` key anywhere (§3.2) — images come from
# GHCR, tagged by the CI/CD pipeline. Deploy-by-SHA in cd.yml sets IMAGE_TAG.

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourorg/civicpulse}/frontend:${IMAGE_TAG}
    networks:
      - edge
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourorg/civicpulse}/backend:${IMAGE_TAG}
    networks:
      - edge
      - internal
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ENVIRONMENT: production
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # No dev bind mount here — this line intentionally absent, per §3.2.

  database:
    image: postgres:16-alpine
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # NO ports: block — never published in prod (§3.2, §5.3 automatic -8)

  cache:
    image: redis:7-alpine
    networks:
      - internal
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    # NO ports: block — never published in prod
