# CivicPulse frontend — nginx site config (ADR 0002: runtime configuration).
#
# This file is a TEMPLATE. The Dockerfile copies it to
#   /etc/nginx/templates/default.conf.template
# and the official nginx image renders it with envsubst when the container
# starts, substituting only variables that are set in the environment:
#
#   BACKEND_UPSTREAM   host:port of the API, e.g. "backend:8000" (Compose)
#                      or "backend.civicpulse.svc.cluster.local:8000" (k8s)
#
# The React bundle only ever calls the relative path /api, so the SAME image
# runs in every environment: build once, deploy many. nginx's own $variables
# below are untouched because they are not environment variables.

# Propagate a caller's X-Request-ID; mint one only when absent.
map $http_x_request_id $civic_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;                 # unprivileged port: the image runs as non-root
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;    # a complaint is at most ~2 KB of text

    # --- security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API: same-origin proxy, so there is no CORS and no baked-in URL ---
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend's rate limiter trusts the right-most entry, which is this hop's view.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $civic_request_id;
        # Triage is capped at 10 s per attempt, one retry: allow for both plus DB time.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- liveness for the frontend container itself -----------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- static assets: content-hashed filenames, cache forever -----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA fallback: client-side routes (/dashboard, /stats) -----------
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
