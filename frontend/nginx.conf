# TODO(you): this implements runtime-config Option B from src/config.ts —
# proxy /api so the frontend never needs an absolute backend URL baked in.
# `backend` below assumes the Compose/K8s service name is literally "backend" —
# confirm that matches your actual service names in compose.yaml / k8s/base/backend-service.yaml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (react-router) needs this
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend — the frontend calls relative "/api/..." only.
    # TODO(you): confirm this path rewrite matches your backend's actual route
    # prefixes (routes are already prefixed with /api in the FastAPI routers,
    # so you likely do NOT want to strip /api here — verify against
    # backend/app/routes/*.py before relying on this).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # TODO(you): decide whether you need gzip, cache headers on static assets,
    # etc. — not required by the spec, optional polish.
}
