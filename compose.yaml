# CivicPulse — development stack.
#   cp .env.example .env && docker compose up -d --build
#
# Differences from compose.prod.yaml: images are BUILT here (build:), the backend
# source is bind-mounted with hot reload, and the backend port is published so
# /docs is reachable. Production pulls immutable images and publishes only the frontend.
name: civicpulse

x-restart: &restart
  restart: unless-stopped

x-backend-env: &backend-env
  POSTGRES_HOST: database
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  REDIS_URL: redis://cache:6379/0
  TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-llm}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
  TRIAGE_TIMEOUT_S: ${TRIAGE_TIMEOUT_S:-10}
  SIMULATED_FAILURE_MODE: ${SIMULATED_FAILURE_MODE:-none}
  SIMULATED_FAILURE_RATE: ${SIMULATED_FAILURE_RATE:-0}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
  RATE_LIMIT_WINDOW_S: ${RATE_LIMIT_WINDOW_S:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TRUST_PROXY_HEADERS: "true"

services:
  # ---------------------------------------------------------------- data
  database:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  cache:
    image: redis:7-alpine
    <<: *restart
    # AOF on a named volume: rate-limit windows and cached triage results
    # (spent LLM quota) survive a restart. See ENGINEERING-NOTES.md.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # One-shot: schema migrations + idempotent seed. Never part of app startup.
  # restart "no" is deliberate: unless-stopped would re-run a finished job forever.
  # It has no long-running process, so no healthcheck; the backend waits for it
  # with condition: service_completed_successfully instead.
  migrate:
    image: civicpulse-backend:dev
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ------------------------------------------------------------- services
  backend:
    image: civicpulse-backend:dev   # same image as migrate: built once
    build:
      context: ./backend
    <<: *restart
    # Dev only: hot reload against the bind-mounted source.
    command: ["uvicorn", "--factory", "app.main:build", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/app", "--no-access-log"]
    environment: *backend-env
    volumes:
      # Dev-only bind mount (absent from compose.prod.yaml): edit code, the
      # server reloads. Wrong in production, where the image must be immutable.
      - ./backend/app:/app/app:ro
    # The only service on both networks. `edge` is not internal, so this is
    # also the one path by which the Gemini call reaches the internet.
    networks: [edge, internal]
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    image: civicpulse-frontend:dev
    build:
      context: ./frontend
    <<: *restart
    environment:
      BACKEND_UPSTREAM: backend:8000
    networks: [edge]          # edge ONLY: no route to database or cache
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # ------------------------------------------------- optional: offline LLM
  # docker compose --profile ollama up -d   and set TRIAGE_PROVIDER=ollama
  ollama:
    image: ollama/ollama:0.34.4
    profiles: [ollama]
    <<: *restart
    volumes:
      - ollama_models:/root/.ollama
    networks: [edge]          # needs egress once, to pull the model
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }

  ollama-pull:
    image: ollama/ollama:0.34.4
    profiles: [ollama]
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:1b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks: [edge]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ------------------------------------ optional: metrics (bonus, +2)
  # docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    <<: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [edge]
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [edge]
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || curl -fsS -o /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

networks:
  edge:           # frontend <-> backend (and backend's route to the internet)
    driver: bridge
  internal:       # backend <-> database <-> cache
    driver: bridge
    internal: true  # no route to the outside world, and none from the frontend

volumes:
  pgdata:         # PostgreSQL data directory — the durable one
  redisdata:      # Redis AOF — rate-limit windows + triage cache (spent LLM quota)
  ollama_models:  # model weights, so ~1 GB is not re-pulled on every up
