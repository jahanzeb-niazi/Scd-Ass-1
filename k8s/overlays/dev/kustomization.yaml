# Local k3d cluster (scripts/k8s-up.sh). Images are built locally and imported
# with `k3d image import`, tagged :dev. Seeds the 33 demo complaints.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: civicpulse-backend
    newName: civicpulse-backend
    newTag: dev
  - name: civicpulse-frontend
    newName: civicpulse-frontend
    newTag: dev

patches:
  # The real Secret is created from .env by scripts/k8s-up.sh (see base/secret.yaml).
  - target: { kind: Secret, name: civicpulse-secrets }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: civicpulse-secrets
  # Dev only: migrations + idempotent seed in the same one-shot Job.
  - target: { kind: Job, name: migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
  # Imported images exist only on the nodes: never try to pull them.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: { kind: Job, name: migrate }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
