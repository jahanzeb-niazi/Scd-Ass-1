# Non-secret configuration. Credentials live in the Secret, never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
data:
  POSTGRES_HOST: database
  POSTGRES_PORT: "5432"
  POSTGRES_USER: civicpulse
  POSTGRES_DB: civicpulse
  REDIS_URL: redis://cache:6379/0
  TRIAGE_PROVIDER: llm
  GEMINI_MODEL: gemini-2.5-flash-lite
  TRIAGE_TIMEOUT_S: "10"
  RATE_LIMIT_REQUESTS: "10"
  RATE_LIMIT_WINDOW_S: "60"
  LOG_LEVEL: INFO
  TRUST_PROXY_HEADERS: "true"
  # Must be < terminationGracePeriodSeconds − preStop sleep (40 − 10 = 30).
  SHUTDOWN_GRACE_S: "25"
  BACKEND_UPSTREAM: backend:8000
