# PLACEHOLDER VALUES ONLY. The committed version of this file must never
# contain a real credential (§5.3: an LLM key in a committed manifest, even
# base64-encoded, is an automatic -15 — "base64 is encoding, not encryption").
#
# TODO(you): in CI/CD, this Secret should be created/patched from GitHub
# Secrets at deploy time (e.g. `kubectl create secret generic ... --dry-run=client
# -o yaml | kubectl apply -f -` in cd.yml), NOT by editing this file with real values.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: civicpulse
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://REPLACE_ME:REPLACE_ME@postgres:5432/civicpulse"
  GROQ_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
