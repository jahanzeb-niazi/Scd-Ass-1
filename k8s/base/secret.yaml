# PLACEHOLDERS ONLY. This file documents the Secret's shape; it is never the
# source of real values. Both overlays remove it ($patch: delete) and the real
# Secret is created out-of-band BEFORE the first apply:
#   * locally:  scripts/k8s-up.sh reads .env  (kubectl create secret ... | kubectl apply)
#   * in CI:    cd.yml reads GitHub Secrets
# Reason: `kubectl apply -k` would otherwise overwrite real values with these
# placeholders on every deploy, and Postgres fixes its password at first init.
# base64 is encoding, not encryption — never commit a real value here.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
  GEMINI_API_KEY: REPLACE_ME
