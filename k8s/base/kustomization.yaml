apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: civicpulse

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - redis-pvc.yaml
  - ingress.yaml
  - hpa.yaml
  - vpa.yaml
  - pdb.yaml

# TODO(you): once you have real image digests/SHAs from CI, consider using
# Kustomize's `images:` transformer here (or per-overlay) instead of hand-
# editing the `image:` fields in backend-deployment.yaml / frontend-deployment.yaml
# directly — cd.yml should be the thing that sets the tag, not a human.
