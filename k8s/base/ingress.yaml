# One host, two paths. Traefik is k3d's bundled ingress controller.
# *.localhost resolves to 127.0.0.1 in browsers and curl — no /etc/hosts edit.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: civicpulse.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 8080 }
