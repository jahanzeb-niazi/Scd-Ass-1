apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  replicas: 2
  revisionHistoryLimit: 10       # keeps `kubectl rollout undo` possible
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                # one extra pod during a rollout
      maxUnavailable: 0          # never drop below desired capacity
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
    spec:
      # SIGTERM → preStop sleep 10 s (pod leaves Service endpoints first) →
      # app drains in-flight requests (SHUTDOWN_GRACE_S=25) → exit. 10 + 25 < 40.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: backend
          image: civicpulse-backend    # overlays pin this to a SHA tag or digest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: GEMINI_API_KEY, optional: true } }
          # Slow start is not failure: up to 30 × 2 s before liveness takes over.
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          # Restarts the pod — must NOT depend on the database.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Removes the pod from the Service — SHOULD depend on the database (and Redis).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # Requests are mandatory: HPA utilisation = usage ÷ request.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
