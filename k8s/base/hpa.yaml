apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilisation = usage ÷ resources.requests.cpu (backend.yaml). Without the
        # request there is no denominator and the HPA shows <unknown>/60% forever.
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # scale down slowly — flapping is expensive
    scaleUp:
      stabilizationWindowSeconds: 0     # scale up immediately — users are waiting
