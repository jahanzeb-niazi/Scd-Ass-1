# Copied structure verbatim from spec §3.3. Requires metrics-server installed
# and resources.requests set on the backend Deployment — without requests,
# the HPA sits at <unknown>/60% forever (the spec's own most common failure).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: civicpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # scale down slowly — flapping is expensive
    scaleUp:
      stabilizationWindowSeconds: 0     # scale up immediately — users are waiting

