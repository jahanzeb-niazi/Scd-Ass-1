# Schema migrations run ONCE per deploy as a Job — never in app startup, and
# never in an initContainer (with ≥2 replicas and an HPA, every pod would race
# to apply the same migration). The dev overlay extends the command with the
# idempotent seed.
#
# Jobs are immutable: delete the finished Job before re-applying
# (scripts/k8s-up.sh and cd.yml do: kubectl delete job migrate --ignore-not-found).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels: { app.kubernetes.io/name: migrate }
spec:
  backoffLimit: 6          # Postgres may still be initialising on a fresh cluster
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: civicpulse-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
