# TODO(you): resources.requests below are PLACEHOLDER GUESSES per §3.3's VPA
# loop instructions — "Record the requests you guessed when you wrote the
# manifest" — then update them from the VPA recommendation later. Don't skip
# recording your original guess; the before/after comparison is graded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30   # TODO(you): confirm this comfortably exceeds your
                                            # longest expected in-flight request (triage timeout
                                            # is 10s, so 30s gives margin) — tune with evidence.
      containers:
        - name: backend
          image: ghcr.io/REPLACE_ME/civicpulse-backend:REPLACE_WITH_SHA  # never :latest (§5.3)
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"      # TODO(you): PLACEHOLDER — record this, then update from VPA (§3.3)
              memory: "128Mi"  # TODO(you): PLACEHOLDER
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health   # MUST NOT depend on the database (§3.3)
              port: 8000
          readinessProbe:
            httpGet:
              path: /ready    # SHOULD depend on the database (§3.3)
              port: 8000
          lifecycle:
            preStop:
              exec:
                # Give the Service time to stop routing here before the
                # process receives SIGTERM — required for the zero-downtime
                # rolling-update demo (§3.3).
                command: ["sh", "-c", "sleep 5"]
