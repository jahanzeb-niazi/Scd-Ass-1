# Headless (clusterIP: None) — required for StatefulSet DNS identity.
# The database is NEVER a NodePort or LoadBalancer (§3.3, §5.3).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: civicpulse
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
