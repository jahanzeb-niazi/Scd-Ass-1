# updateMode "Off" = recommend only, never evict/resize automatically.
# Running VPA in Auto mode alongside this HPA would fight it: VPA raises the
# CPU request -> computed utilization (usage/request) drops -> HPA scales in
# -> per-pod load rises -> VPA raises the request again. Recommender mode +
# a human decision is the documented resolution (§3.3) — explain this
# conflict in docs/ENGINEERING-NOTES.md question 6, don't just assert it.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend-vpa
  namespace: civicpulse
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  updatePolicy:
    updateMode: "Off"

